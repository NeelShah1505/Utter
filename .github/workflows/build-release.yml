# build-release.yml — Build and publish GitHub Releases for Dictate
#
# Triggers: push of a semver tag (v*.*.*) on the main branch.
#
# Jobs:
#   build-macos-arm64    → app-macos-arm64.dmg
#   release              → GitHub Release with that dmg and its .sha256
#
# Intel Mac and Windows are not built. Do not upload placeholder files
# under installer names.
#
# Shipped artifact: app-macos-arm64.dmg only.

name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # e.g. v1.0.0, v1.0.0-beta.1

# Only one release workflow runs at a time per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a release mid-flight

permissions:
  contents: write  # Needed to create GitHub Releases

jobs:

  # ---------------------------------------------------------------------------
  # macOS Apple Silicon build
  # ---------------------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14  # Apple Silicon runner (M1/M2)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./apps/desktop
        run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build macOS Apple Silicon
        working-directory: ./apps/desktop
        run: |
          cargo tauri build --target aarch64-apple-darwin
          mkdir -p ../../dist
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg ../../dist/app-macos-arm64.dmg

      # Rename to canonical filename (idempotent once real build is in place)
      - name: Stage artifact
        run: mv dist/app-macos-arm64.dmg app-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-macos-arm64.dmg
          path: app-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  # Intel Mac and Windows jobs were removed on purpose.
  # Those jobs uploaded text files named like installers. Do not add them back
  # until the speech engine runs on that platform and a clean machine can dictate.

  # ---------------------------------------------------------------------------
  # Release job
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs:
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download all four build artifacts into the current directory
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Compute SHA-256 for each asset (published alongside release for verification)
      - name: Compute SHA-256 checksums
        run: |
          sha256sum app-macos-arm64.dmg > app-macos-arm64.dmg.sha256
          echo "--- SHA-256 checksums ---"
          cat *.sha256

      # Create the GitHub Release and upload all assets + checksums.
      # Uses the tag name as the release name; body is the tag annotation or empty.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # draft: false means it goes live immediately; set true if human review wanted
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # e.g. v1.0.0-beta.1 → prerelease
          generate_release_notes: true   # Auto-generates notes from PRs/commits
          files: |
            app-macos-arm64.dmg
            app-macos-arm64.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
