name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  site:
    name: Site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test site/assets/detect.test.js site/assets/releases.test.js

  desktop:
    name: Rust tests (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test --bin utter
