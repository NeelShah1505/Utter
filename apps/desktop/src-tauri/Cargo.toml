[package]
name = "utter"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Type with your voice. Everywhere. Offline."
license = "MIT"
authors = ["Utter contributors"]

# See Tauri's Cargo.toml guide:
# https://tauri.app/start/create-project/

[lib]
name = "utter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring = "3"
dirs = "6"

# Audio capture
cpal = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific: used for text insertion via accessibility API
# core-foundation and objc are indirect deps via tauri; we reference them directly
# for the CoreGraphics CGEvent synthetic input path.
# Actual bindings written in Phase 2 — these are declared now so they resolve.
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific: used for SendInput text insertion
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
