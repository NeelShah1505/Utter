[package]
name = "utter"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Type with your voice. Everywhere. Offline."
license = "MIT"
authors = ["Utter contributors"]

# See Tauri's Cargo.toml guide:
# https://tauri.app/start/create-project/

[lib]
name = "utter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api",
    "tray-icon",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
keyring = "3"
dirs = "6"

# Speech engine — whisper.cpp via safe Rust bindings (builds whisper.cpp).
whisper-rs = "0.14"

# Audio capture
cpal = "0.15"
# cpal's CoreAudio Stream is !Send, so we wrap it in SendWrapper to store in Tauri state
send_wrapper = "0.6"

# Text insertion — cross-platform synthetic input (macOS CGEvent, Windows SendInput)
enigo = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

# enigo handles macOS (CGEvent) and Windows (SendInput) internally — no manual platform deps needed.

[dev-dependencies]
# WAV reading for the offline transcription benchmark (tests/examples only).
hound = "3"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
